name: Code checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landing:
    name: Landing
    runs-on: ubuntu-latest
    env:
      PUBLIC_SANITY_PROJECT_ID: 3qxptft9
      PUBLIC_SANITY_DATASET: production
      PUBLIC_SITE_URL: https://rodri-stampone.vercel.app/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

  studio:
    name: Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    env:
      SANITY_STUDIO_PROJECT_ID: 3qxptft9
      SANITY_STUDIO_DATASET: production
      SANITY_STUDIO_LANDING_URL: https://rodri-stampone.vercel.app/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json
      - name: Install root build configuration dependencies
        run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run check
      - run: npm run build
